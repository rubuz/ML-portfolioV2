<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" as="image" href="./src/assets/portrait.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Matjaž Lovenjak, Senior Software Developer in Slovenia. I build enterprise web and mobile apps with Angular, React, React Native and TypeScript, and own the UI/UX from first concept to deployment."
    />
    <title>Matjaž Lovenjak – Senior Software Developer</title>
    <meta name="theme-color" content="#000000" />
    <link rel="canonical" href="https://lovenjak.vercel.app/" />

    <!-- Link previews (LinkedIn, Slack, X...) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://lovenjak.vercel.app/" />
    <meta
      property="og:title"
      content="Matjaž Lovenjak – Senior Software Developer"
    />
    <meta
      property="og:description"
      content="Senior Software Developer building enterprise web and mobile apps with Angular, React, React Native and TypeScript."
    />
    <meta
      property="og:image"
      content="https://lovenjak.vercel.app/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Matjaž Lovenjak, Senior Software Developer"
    />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap"
    />
    <style>
      #preloader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #000;
        z-index: 9999;
        display: grid;
        place-items: center;
      }

      .loader__text {
        color: #fff;
        font-size: 2rem;
        font-weight: 700;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        text-transform: uppercase;
        letter-spacing: 0.15rem;
        animation: scale-up 0.6s forwards;
      }

      .slide-up {
        animation: slide-up 0.5s forwards;
      }
      @keyframes slide-up {
        0% {
          transform: translateY(0);
        }
        100% {
          transform: translateY(-100%);
        }
      }

      @keyframes scale-up {
        0% {
          transform: scale(0);
        }
        100% {
          transform: scale(1);
        }
      }
    </style>
  </head>
  <body>
    <div id="preloader">
      <h2 class="loader__text">LOVENJAK</h2>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
