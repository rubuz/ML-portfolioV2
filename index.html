<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" as="image" href="./src/assets/portrait.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Matjaž Lovenjak, Senior Software Developer in Slovenia. I build enterprise web and mobile apps with Angular, React, React Native and TypeScript, and own the UI/UX from first concept to deployment."
    />
    <title>Matjaž Lovenjak – Senior Software Developer</title>
    <meta name="theme-color" content="#000000" />
    <link rel="canonical" href="https://lovenjak.vercel.app/" />

    <!-- Link previews (LinkedIn, Slack, X...) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://lovenjak.vercel.app/" />
    <meta
      property="og:title"
      content="Matjaž Lovenjak – Senior Software Developer"
    />
    <meta
      property="og:description"
      content="Senior Software Developer building enterprise web and mobile apps with Angular, React, React Native and TypeScript."

    <meta
      property="og:image"
      content="https://lovenjak.vercel.app/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Matjaž Lovenjak, Senior Software Developer"
    />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@800&family=Work+Sans:wght@400;500;600;700&display=swap"
    />
    <style>
      /* Black panel until React's Preloader takes over (it removes this) */
      #preloader {
        position: fixed;
        inset: 0;
        background: #000;
        z-index: 9999;
      }
      @media (prefers-reduced-motion: reduce) {
        #preloader {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="preloader"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
